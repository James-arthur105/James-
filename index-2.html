<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>May Your Love Never End</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #00040d;
    color: #ffe0f1;
    font-family: Georgia, "Times New Roman", serif;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .quote {
    position: fixed;
    left: 50%;
    bottom: 12%;
    transform: translateX(-50%);
    width: 92%;
    text-align: center;
    color: #ffd6ec;
    font-size: clamp(20px, 5vw, 34px);
    font-style: italic;
    letter-spacing: 1px;
    text-shadow: 0 0 8px #ff8ccf, 0 0 22px #a46dff;
    opacity: 0;
    animation: appear 3s ease 2s forwards, glow 3s ease-in-out 5s infinite alternate;
    pointer-events: none;
  }
  .hint {
    position: fixed;
    top: 16px;
    left: 0;
    width: 100%;
    text-align: center;
    font: 12px Arial, sans-serif;
    color: rgba(220,220,255,.45);
    letter-spacing: 3px;
    pointer-events: none;
  }
  @keyframes appear { to { opacity: 1; } }
  @keyframes glow {
    from { text-shadow: 0 0 8px #ff8ccf, 0 0 18px #a46dff; }
    to { text-shadow: 0 0 14px #fff, 0 0 30px #ff71c6, 0 0 45px #9871ff; }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="hint">A LITTLE UNIVERSE FOR YOU</div>
<div class="quote">May Your Love Never End.</div>
<script>
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d');
let w, h, stars = [], dust = [], t = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  w = window.innerWidth; h = window.innerHeight;
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  stars = Array.from({length: Math.max(130, Math.floor(w*h/3600))}, () => ({
    x: Math.random()*w, y: Math.random()*h,
    r: Math.random()*1.35+.2, a: Math.random()*.75+.15,
    speed: Math.random()*.018+.004, phase: Math.random()*Math.PI*2
  }));
  dust = Array.from({length: 90}, () => ({
    x: Math.random()*w, y: Math.random()*h,
    r: Math.random()*1.5+.3, vy: Math.random()*.35+.08,
    vx: (Math.random()-.5)*.18, a: Math.random()*.65+.15
  }));
}
function draw() {
  t += 0.016;
  ctx.fillStyle = '#00040d';
  ctx.fillRect(0, 0, w, h);

  // Subtle midnight-violet glow
  const glow = ctx.createRadialGradient(w*.5, h*.43, 0, w*.5, h*.43, Math.max(w,h)*.72);
  glow.addColorStop(0, 'rgba(40,22,65,.28)');
  glow.addColorStop(.55, 'rgba(12,10,35,.12)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, w, h);

  for (const s of stars) {
    const alpha = s.a * (.45 + .55 * (Math.sin(t*s.speed*60+s.phase)+1)/2);
    ctx.beginPath();
    ctx.fillStyle = `rgba(238,226,255,${alpha})`;
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
    if (s.r > 1.15) {
      ctx.strokeStyle = `rgba(255,210,242,${alpha*.45})`;
      ctx.lineWidth = .5;
      ctx.beginPath(); ctx.moveTo(s.x-3,s.y); ctx.lineTo(s.x+3,s.y);
      ctx.moveTo(s.x,s.y-3); ctx.lineTo(s.x,s.y+3); ctx.stroke();
    }
  }
  for (const p of dust) {
    p.x += p.vx; p.y -= p.vy;
    if (p.y < -3) { p.y = h+3; p.x = Math.random()*w; }
    if (p.x < -3) p.x = w+3;
    if (p.x > w+3) p.x = -3;
    ctx.beginPath();
    ctx.fillStyle = `rgba(218,190,255,${p.a})`;
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  }
  requestAnimationFrame(draw);
}
window.addEventListener('resize', resize);
resize();
draw();
</script>
</body>
</html>
